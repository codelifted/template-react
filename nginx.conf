server {
    listen 80;
    server_name _;  # Specific to your IP

    location / {
        root /usr/share/nginx/html;  # Serve files from the root
        try_files $uri $uri/ index.html;  # SPA routing with /frontend prefix
    }

    location /static/ {
        root /usr/share/nginx/html;  # Serve static assets from the root
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        root /usr/share/nginx/html;  # Explicitly set root for static files
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
}