server {
    listen 80;
    server_name 52.166.110.168;  # Specific to your IP

    location /frontend {
        alias /usr/share/nginx/html;  # Serve React app from this root
        try_files $uri $uri/ /frontend/index.html;  # SPA routing
    }

    location /frontend/static/ {
        alias /usr/share/nginx/html/static/;  # Serve static assets
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
}